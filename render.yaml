services:
  - type: web
    name: alias
    runtime: node
    buildCommand: npm ci --include=dev && npm run build
    preDeployCommand: npm run db:migrate
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 24.18.0
      - key: DATABASE_URL
        fromDatabase:
          name: alias-db
          property: connectionString
      - key: FEATHERLESS_API_KEY
        sync: false
      - key: FEATHERLESS_MODEL
        sync: false
      - key: CRON_SECRET
        sync: false
  - type: worker
    name: alias-worker
    runtime: node
    buildCommand: npm ci --include=dev
    startCommand: npm run db:migrate && npm run worker
    envVars:
      - key: NODE_VERSION
        value: 24.18.0
      - key: DATABASE_URL
        fromDatabase:
          name: alias-db
          property: connectionString
      - key: FEATHERLESS_API_KEY
        fromService:
          type: web
          name: alias
          envVarKey: FEATHERLESS_API_KEY
      - key: FEATHERLESS_MODEL
        fromService:
          type: web
          name: alias
          envVarKey: FEATHERLESS_MODEL
  - type: cron
    name: alias-research
    runtime: node
    schedule: "0 6 * * *"
    buildCommand: npm ci --include=dev
    startCommand: npm run cron:research
    envVars:
      - key: NODE_VERSION
        value: 24.18.0
      - key: APP_URL
        sync: false
      - key: CRON_SECRET
        fromService:
          type: web
          name: alias
          envVarKey: CRON_SECRET
databases:
  - name: alias-db
