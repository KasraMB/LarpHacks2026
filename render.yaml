services:
  - type: web
    name: alias
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:render
    envVars:
      - key: NODE_VERSION
        value: 24.18.0
      - key: DATABASE_URL
        fromDatabase:
          name: alias-db
          property: connectionString
      - key: FEATHERLESS_API_KEY
        sync: false
      - key: FEATHERLESS_MODEL
        sync: false
      - key: CRON_SECRET
        sync: false
databases:
  - name: alias-db
    plan: free
